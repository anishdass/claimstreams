# render.yaml
# Functionality: Multi-service infrastructure blueprint specification for Render.
# Why it is required: Provides a declarative configuration to build and launch PostgreSQL, Redis (Key-Value), Spring Boot, and React services in a single automated step.

services:
  # 1. Spring Boot Backend Service
  - type: web
    name: claimstreams-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: claimstreams-db
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: keyvalue
          name: claimstreams-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: keyvalue
          name: claimstreams-redis
          property: port

  # 2. React Frontend Service
  - type: web
    name: claimstreams-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

  # 3. Render Managed Redis (Key-Value) Instance
  - type: keyvalue
    name: claimstreams-redis
    ipAllowList: []

databases:
  # 4. Managed PostgreSQL Database
  - name: claimstreams-db
    databaseName: claimstream
    user: postgres