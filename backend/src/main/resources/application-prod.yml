spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST_PROD}:${DB_PORT_PROD}/${DB_NAME_PROD}
    username: ${DB_USER_PROD}
    spring:
      datasource:
        password: ${DB_PASS_PROD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST_PROD}
      port: ${REDIS_PORT_PROD}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS_PROD}
    consumer:
      group-id: claimstream-adjudication-group
      auto-offset-reset: earliest